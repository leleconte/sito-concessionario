<!DOCTYPE html>

<meta charset="UTF-8">

<title>Cars Around The World</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: #fff;
  text-align: center;
}

header {
  background: #000;
  padding: 20px;
  border-bottom: 2px solid #444;
  position: sticky;
  top: 0;
  z-index: 20;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  background: #444;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #666;
}

.container {
  padding: 30px;
}

.car {
  display: inline-block;
  vertical-align: top;
  width: 240px;
  margin: 12px;
  padding: 15px;
  background: #222;
  border-radius: 10px;
  border: 1px solid #2f2f2f;
}

.car:hover {
  border-color: #666;
  transform: translateY(-2px);
}

.car img {
  width: 100%;
  border-radius: 8px;
  margin-top: 10px;
}

.price {
  font-size: 18px;
  font-weight: 700;
  margin: 8px 0 4px;
}

.type {
  display: inline-block;
  padding: 4px 8px;
  margin-top: 4px;
  border-radius: 999px;
  background: #333;
  color: #ddd;
  font-size: 11px;
  font-weight: 700;
}

.subcategory {
  min-height: 16px;
  margin-top: 7px;
  color: #aaa;
  font-size: 11px;
}

.empty {
  padding: 40px 15px;
  color: #aaa;
}

@media (max-width: 600px) {
  .container { padding: 14px; }
  .car {
    width: calc(50% - 36px);
    min-width: 135px;
    margin: 6px;
    padding: 10px;
  }
}
</style>
</head>

const params = new URLSearchParams(window.location.search);
let brand = params.get("brand") || "";

if (brand === "Ubermacht" || brand === "UBERMACHT") brand = "Übermacht";

document.getElementById("brandTitle").textContent =
  brand ? "Cars Around The World – " + brand : "Cars Around The World";

const container = document.getElementById("cars");

if (cars[brand]) {
  cars[brand].forEach(vehicle => {
    const div = document.createElement("div");
    div.className = "car";

    const title = document.createElement("h3");
    title.textContent = vehicle.m;

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = vehicle.p;

    const type = document.createElement("div");
    type.className = "type";
    type.textContent = vehicle.tipo;

    const subcategory = document.createElement("div");
    subcategory.className = "subcategory";
    subcategory.textContent = vehicle.categoria || "";

    const img = document.createElement("img");
    img.src =
      "https://via.placeholder.com/400x200?text=" +
      encodeURIComponent(brand + " " + vehicle.m);
    img.alt = brand + " " + vehicle.m;

    div.appendChild(title);
    div.appendChild(price);
    div.appendChild(type);
    div.appendChild(subcategory);
    div.appendChild(img);
    container.appendChild(div);
  });
} else {
  container.innerHTML =
    '<div class="empty">Nessun veicolo trovato per questo marchio.</div>';
